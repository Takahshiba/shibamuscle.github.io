  <text x="56" y="302" fill="#d7d7d7" font-size="24" font-family="'Noto Sans JP', sans-serif">上腕二頭筋</text>
  <rect x="56" y="358" width="520" height="152" rx="28" fill="#0a0a0a" stroke="#ff6a00" stroke-opacity="0.34" />
  <text x="92" y="410" fill="#b8b8b8" font-size="22" font-weight="700" font-family="'Noto Sans JP', sans-serif">中級の目安</text>
  <text x="92" y="474" fill="#ffffff" font-size="42" font-weight="800" font-family="'Noto Sans JP', sans-serif">男性 57 kg / (125 lbs) | 女性 28 kg / (63 lbs)</text>
  <text x="92" y="520" fill="#b8b8b8" font-size="22" font-family="'Noto Sans JP', sans-serif">腕 / 重量</text>
