<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">ケーブルレッグエクステンション</title>
  <desc id="desc">ケーブルレッグエクステンションの平均重量と基準重量を、脚の代表種目として確認できます。主働筋は大腿四頭筋です。</desc>
  <defs>
    <linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#160c04" />
      <stop offset="54%" stop-color="#050403" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%" stop-color="#ffbd55" />
      <stop offset="100%" stop-color="#ff6a00" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" rx="28" />
  <circle cx="1000" cy="120" r="190" fill="#ff6a00" opacity="0.22" />
  <circle cx="1080" cy="560" r="260" fill="#ffbd55" opacity="0.1" />
  <rect x="42" y="38" width="1116" height="554" rx="30" fill="#030303" opacity="0.72" stroke="#ff6a00" stroke-opacity="0.34" />
  <rect x="66" y="58" width="176" height="40" rx="20" fill="url(#accent)" />
  <text x="92" y="84" fill="#130800" font-size="21" font-weight="900" font-family="'Noto Sans JP', sans-serif">SHIBA</text>
  <text x="66" y="150" fill="#ffbd55" font-size="24" font-weight="800" font-family="'Noto Sans JP', sans-serif">LIFT / TRACK / SHARE</text>
  <text x="66" y="226" fill="#ffffff" font-size="66" font-weight="900" font-family="'Noto Sans JP', sans-serif">ケーブルレッグエクステンション</text>
  <text x="66" y="286" fill="#ff9a24" font-size="29" font-weight="800" font-family="'Noto Sans JP', sans-serif">平均重量 / 基準重量</text>
  <text x="66" y="342" fill="#d8d2cb" font-size="24" font-family="'Noto Sans JP', sans-serif">大腿四頭筋</text>
  <rect x="66" y="392" width="548" height="136" rx="22" fill="#090806" stroke="#ff6a00" stroke-opacity="0.42" />
  <text x="96" y="438" fill="#bcb3aa" font-size="21" font-weight="800" font-family="'Noto Sans JP', sans-serif">中級の目安</text>
  <text x="96" y="494" fill="#ffffff" font-size="40" font-weight="900" font-family="'Noto Sans JP', sans-serif">男性 35 kg | 女性 18 kg</text>
  <text x="96" y="548" fill="#ffbd55" font-size="21" font-weight="800" font-family="'Noto Sans JP', sans-serif">脚 / 重量</text>
  <rect x="770" y="104" width="338" height="338" rx="28" fill="#ffffff" stroke="#ff6a00" stroke-opacity="0.45" />
  <image href="https://shibamuscle.com/assets/cable-leg-extension-gif.webp" x="814" y="144" width="250" height="250" preserveAspectRatio="xMidYMid meet" />
  <rect x="770" y="476" width="338" height="74" rx="18" fill="url(#accent)" />
  <text x="812" y="522" fill="#130800" font-size="27" font-weight="900" font-family="'Noto Sans JP', sans-serif">脚 / 脚トレ</text>
</svg>
