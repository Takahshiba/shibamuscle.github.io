  <text x="84" y="77" fill="#130800" font-size="22" font-weight="800" font-family="'Noto Sans JP', sans-serif">Shiba Muscle</text>
  <text x="56" y="170" fill="#ffffff" font-size="64" font-weight="800" font-family="'Noto Sans JP', sans-serif">マシーンバイセップカール</text>
